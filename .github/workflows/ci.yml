name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      # No download here: Inside Airbnb asks for the data to be fetched once,
      # not on every run. The build and every query are tested on a hand-made
      # fixture snapshot; the README is checked against the committed results;
      # the byte-for-byte regeneration test needs the real data and is skipped.
      - name: pytest
        run: pytest -q -rs
